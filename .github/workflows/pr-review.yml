name: AI PR Review

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # 只处理 PR 评论
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review')

    runs-on: ubuntu-latest

    steps:

      - name: Check permission
        id: permission
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const username = context.payload.comment.user.login;

            const result = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username
            });

            const permission = result.data.permission;

            console.log(`${username}: ${permission}`);

            const allowed = [
              "admin",
              "maintain",
              "write"
            ];

            core.setOutput(
              "allowed",
              allowed.includes(permission)
            );


      - name: Stop unauthorized user
        if: steps.permission.outputs.allowed != 'true'
        run: |
          echo "No permission"
          exit 1


      - name: Run PR Agent
        if: steps.permission.outputs.allowed == 'true'
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          OPENAI_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          OPENAI_API_BASE: https://api.deepseek.com

          CONFIG__MODEL: deepseek/deepseek-v4-flash

          CONFIG__FALLBACK_MODELS: deepseek/deepseek-v4-pro

          CONFIG__CUSTOM_MODEL_MAX_TOKENS: 32000